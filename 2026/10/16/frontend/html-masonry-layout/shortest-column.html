<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS 最短列瀑布流演示</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #1b2838; }
    main { max-width: 1100px; margin: auto; padding: 34px 20px 64px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    p { margin: 0 0 24px; color: #526174; line-height: 1.7; }
    .note { display: inline-block; margin-bottom: 24px; padding: 9px 13px; border-radius: 9px; background: #e0ebff; color: #264b8a; }
    .masonry { position: relative; }
    .card { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 14px; background: white; box-shadow: 0 5px 24px #253b5914; transition: left .25s ease, top .25s ease; }
    .art { display: grid; place-items: center; height: var(--height); background: var(--color); color: white; font-size: 3rem; font-weight: 800; }
    .body { padding: 14px 16px 17px; }
    .body strong { display: block; margin-bottom: 6px; }
    .body small { color: #64748b; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>JS 最短列瀑布流</h1>
    <p>每张卡片进入当前最短的列。改变窗口宽度可观察重新计算列数和位置。</p>
    <div class="note">核心：测量高度 → 选最短列 → 设置 left/top</div>
    <div class="masonry" id="masonry"></div>
  </main>
  <script>
    const GAP = 16;
    const MIN_WIDTH = 220;
    const masonry = document.querySelector('#masonry');
    const colors = ['#647ec9', '#c06c8c', '#4e9a91', '#d08b4e', '#7970b5'];
    const heights = [130, 205, 155, 230, 175, 120, 245, 165, 195, 145, 215, 135, 180, 225, 150, 200, 125, 235];
    const fragment = document.createDocumentFragment();
    const cards = heights.map((height, index) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.setProperty('--height', `${height}px`);
      card.style.setProperty('--color', colors[index % colors.length]);
      const art = document.createElement('div');
      art.className = 'art';
      art.textContent = String(index + 1).padStart(2, '0');
      const body = document.createElement('div');
      body.className = 'body';
      const title = document.createElement('strong');
      title.textContent = `作品 ${index + 1}`;
      const caption = document.createElement('small');
      caption.textContent = index % 3 === 0 ? '这里有较长的说明文字，用来展示卡片高度会受到列宽和换行影响。' : '总是放到当前最短列。';
      body.append(title, caption);
      card.append(art, body);
      fragment.append(card);
      return card;
    });
    masonry.append(fragment);

    let frame = 0;
    let lastWidth = 0;
    function layout() {
      frame = 0;
      const width = masonry.clientWidth;
      if (width === lastWidth) return;
      lastWidth = width;
      const count = Math.max(1, Math.floor((width + GAP) / (MIN_WIDTH + GAP)));
      const cardWidth = (width - (count - 1) * GAP) / count;
      // 先完成全部写入，再集中读取高度，最后集中写入位置。
      cards.forEach(card => { card.style.width = `${cardWidth}px`; });
      const measured = cards.map(card => card.getBoundingClientRect().height);
      const columnHeights = Array(count).fill(0);
      cards.forEach((card, index) => {
        const column = columnHeights.indexOf(Math.min(...columnHeights));
        card.style.left = `${column * (cardWidth + GAP)}px`;
        card.style.top = `${columnHeights[column]}px`;
        columnHeights[column] += measured[index] + GAP;
      });
      masonry.style.height = `${Math.max(...columnHeights) - GAP}px`;
    }
    const resizeObserver = new ResizeObserver(() => {
      if (!frame) frame = requestAnimationFrame(layout);
    });
    resizeObserver.observe(masonry);
    layout();
  </script>
</body>
</html>
